<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIRUXY MOVIES</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    linear-gradient(135deg,#080014,#17002f,#050008);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hide{
  display:none!important;
}

header{
  height:72px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#09000fcc;
  border-bottom:1px solid #ffffff20;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.logo b{
  color:#ff3191;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#713cff,#ff2586);
}

.small{
  padding:9px 12px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:#ffffff18;
}

.danger{
  background:#d92855;
}

#login{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.box{
  width:min(430px,100%);
  padding:36px 30px;
  border-radius:28px;
  text-align:center;
  background:#ffffff0d;
  border:1px solid #ffffff20;
  box-shadow:0 25px 80px #0008;
}

.icon{
  font-size:55px;
}

.box h1{
  margin:8px 0;
  font-size:32px;
}

.muted{
  color:#c8bfd5;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  margin:8px 0 12px;
  border:1px solid #ffffff20;
  border-radius:12px;
  background:#09000f;
  color:#fff;
  outline:0;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.box .btn{
  width:100%;
}

.link{
  display:inline-block;
  margin-top:16px;
  color:#ff68ad;
  font-weight:800;
  text-decoration:none;
}

.msg{
  min-height:20px;
  margin-top:10px;
}

main{
  padding:45px 24px;
}

.hero{
  text-align:center;
  max-width:900px;
  margin:auto;
}

.hero h1{
  font-size:clamp(38px,7vw,68px);
  margin:15px 0;
}

.grad{
  background:linear-gradient(90deg,#a66cff,#ff3b9c);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#c9bfd7;
}

.cards{
  max-width:900px;
  margin:35px auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

.card{
  border:1px solid #ffffff20;
  border-radius:26px;
  padding:35px;
  min-height:230px;
  color:#fff;
  text-align:left;
  box-shadow:0 20px 55px #0006;
}

.movies{
  background:linear-gradient(135deg,#5b25ff,#a62dff);
}

.private{
  background:linear-gradient(135deg,#d51c70,#ff4b4b);
}

.card h2{
  font-size:30px;
}

.card button{
  margin-top:25px;
}

.section{
  max-width:1100px;
  margin:auto;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:22px;
}

.item{
  background:#ffffff0b;
  border:1px solid #ffffff16;
  border-radius:18px;
  overflow:hidden;
}

.poster{
  width:100%;
  height:280px;
  object-fit:cover;
  background:#180d24;
}

.item-body{
  padding:16px;
}

.item h3{
  margin:0 0 8px;
}

.item p{
  color:#c9bfd5;
  font-size:14px;
  line-height:1.5;
}

.watch{
  width:100%;
  margin-top:8px;
}

.player{
  background:#000;
  border-radius:18px;
  padding:10px;
  border:1px solid #ffffff18;
}

video{
  display:block;
  width:100%;
  max-height:72vh;
  background:#000;
  border-radius:12px;
}

.player-error{
  padding:15px;
  color:#ff9aaa;
  text-align:center;
  word-break:break-word;
}

.admin{
  max-width:1000px;
  margin:35px auto;
  padding:25px;
  border-radius:22px;
  background:#ffffff0b;
  border:1px solid #ffffff18;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.admin-row{
  padding:12px 0;
  border-bottom:1px solid #ffffff18;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.loading{
  text-align:center;
  padding:30px;
}

.file-note{
  font-size:12px;
  color:#a99db5;
}

@media(max-width:700px){

  .cards,
  .row{
    grid-template-columns:1fr;
  }

  header{
    padding:0 14px;
  }

  main{
    padding:30px 15px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    BIRUXY <b>MOVIES</b>
  </div>

  <button
    class="btn hide"
    id="logoutBtn"
    onclick="logout()">
    LOGOUT
  </button>

</header>


<!-- =========================
     LOGIN
========================= -->

<section id="login">

  <div class="box">

    <div class="icon">
      🎬
    </div>

    <h1>
      Welcome
    </h1>

    <p class="muted">
      Enter the username generated by
      the ADUNLOCK website.
    </p>

    <input
      id="key"
      placeholder="USER-XXXXXXXX"
      autocomplete="off">

    <button
      class="btn"
      id="loginBtn"
      onclick="login()">
      LOGIN
    </button>

    <div
      id="loginMsg"
      class="msg">
    </div>

    <a
      class="link"
      href="https://biruxy-movies.onrender.com"
      target="_blank">
      Get your username from user website
    </a>

  </div>

</section>


<!-- =========================
     HOME
========================= -->

<section
  id="home"
  class="hide">

  <main>

    <div class="hero">

      <h1>
        Watch
        <span class="grad">
          Your Content
        </span>
      </h1>

      <p>
        Select a category.
        Movies are loaded from the
        BIRUXY server.
      </p>

    </div>


    <div class="cards">

      <div class="card movies">

        <h2>
          🎬 MOVIES
        </h2>

        <p>
          Open the Movies section.
        </p>

        <button
          class="btn"
          onclick="openCategory('movies')">
          OPEN MOVIES
        </button>

      </div>


      <div class="card private">

        <h2>
          🔐 PRIVATE
        </h2>

        <p>
          Open the Private section.
        </p>

        <button
          class="btn"
          onclick="openCategory('private')">
          OPEN PRIVATE
        </button>

      </div>

    </div>


    <div
      id="content"
      class="section hide">
    </div>


    <div
      id="adminArea"
      class="admin hide">
    </div>

  </main>

</section>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API =
  "https://biruxy-access-api.onrender.com";

const USER_SITE =
  "https://biruxy-movie.onrender.com";


let movies = [];

let adminToken = "";


/* =====================================================
   HELPER
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   MEDIA URL
   Converts /uploads/file.mp4
   into backend URL
===================================================== */

function mediaUrl(value){

  if(!value){
    return "";
  }

  value =
    String(value).trim();

  if(
    /^https?:\/\//i.test(value)
  ){

    return value;

  }

  return (
    API.replace(/\/+$/,"") +
    "/" +
    value.replace(/^\/+/,"")
  );

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[match];

      }
    );

}


/* =====================================================
   LOGIN MESSAGE
===================================================== */

function msg(
  text,
  ok=false
){

  $("loginMsg").textContent =
    text;

  $("loginMsg").style.color =
    ok
      ? "#7dffb2"
      : "#ff718d";

}


/* =====================================================
   USER LOGIN
===================================================== */

async function login(){

  const key =
    $("key")
      .value
      .trim()
      .toUpperCase();

  if(!key){

    msg(
      "Please enter your username."
    );

    return;

  }


  $("loginBtn").disabled =
    true;

  msg(
    "Checking username...",
    true
  );


  try{

    const response =
      await fetch(
        API +
        "/api/keys/verify",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            key:key
          })

        }
      );


    const data =
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(
      !response.ok ||
      !data.valid
    ){

      throw new Error(
        data.error ||
        "Invalid or expired username."
      );

    }


    sessionStorage.setItem(
      "movie_access",
      key
    );


    showHome();


  }catch(error){

    msg(
      error.message
    );

  }finally{

    $("loginBtn").disabled =
      false;

  }

}


/* =====================================================
   SHOW HOME
===================================================== */

function showHome(){

  $("login")
    .classList
    .add("hide");

  $("home")
    .classList
    .remove("hide");

  $("logoutBtn")
    .classList
    .remove("hide");

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  sessionStorage.removeItem(
    "movie_access"
  );

  location.reload();

}


/* =====================================================
   LOAD MOVIES
===================================================== */

async function loadMovies(){

  const response =
    await fetch(
      API +
      "/api/movies",
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "Could not load movies."
    );

  }


  const data =
    await response
      .json();


  movies =
    Array.isArray(data)
      ? data
      : [];


  return movies;

}


/* =====================================================
   OPEN CATEGORY
===================================================== */

async function openCategory(
  type
){

  const content =
    $("content");


  content
    .classList
    .remove("hide");


  content.innerHTML =
    `
      <div class="loading">
        Loading content...
      </div>
    `;


  content.scrollIntoView({
    behavior:"smooth"
  });


  try{

    await loadMovies();


    const list =
      movies.filter(
        item =>
          String(
            item.category || ""
          )
          .toLowerCase()
          ===
          type
      );


    content.innerHTML =

      `
        <div class="section-head">

          <h2>
            ${
              type === "movies"
                ? "🎬 Movies"
                : "🔐 Private"
            }
          </h2>

          <button
            class="small"
            onclick="closeContent()">
            HOME
          </button>

        </div>
      `;


    if(!list.length){

      content.innerHTML +=
        `
          <p class="muted">
            No content has been added yet.
          </p>
        `;

      return;

    }


    const grid =
      document.createElement(
        "div"
      );

    grid.className =
      "grid";


    list.forEach(
      movie => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "item";


        const poster =
          mediaUrl(
            movie.poster
          );


        item.innerHTML =

          `
            ${
              poster
              ?
              `
                <img
                  class="poster"
                  src="${safe(poster)}"
                  alt="${safe(movie.title)}"
                  onerror="
                    this.style.display='none'
                  ">
              `
              :
              ""
            }

            <div class="item-body">

              <h3>
                ${safe(movie.title)}
              </h3>

              <p>
                ${safe(movie.description)}
              </p>

              <button
                class="btn watch">
                ▶ WATCH NOW
              </button>

            </div>
          `;


        item
          .querySelector(
            ".watch"
          )
          .onclick =
            () =>
              watchMovie(movie);


        grid.appendChild(
          item
        );

      }
    );


    content.appendChild(
      grid
    );


  }catch(error){

    content.innerHTML =
      `
        <p class="muted">
          ${safe(error.message)}
        </p>
      `;

  }

}


/* =====================================================
   CLOSE CONTENT
===================================================== */

function closeContent(){

  $("content")
    .classList
    .add("hide");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   WATCH MOVIE
===================================================== */

function watchMovie(movie){

  const content =
    $("content");


  const url =
    mediaUrl(
      movie.video
    );


  if(!url){

    content.innerHTML =
      `
        <p class="muted">
          Video URL is missing.
        </p>
      `;

    return;

  }


  content.innerHTML =

    `
      <div class="section-head">

        <h2>
          ${safe(movie.title)}
        </h2>

        <button
          class="small"
          id="backBtn">
          BACK
        </button>

      </div>


      <div class="player">

        <video
          id="moviePlayer"
          controls
          playsinline
          preload="auto">

          <source
            src="${safe(url)}">

          Your browser does not
          support HTML5 video.

        </video>


        <div
          id="playerError"
          class="player-error hide">
        </div>

      </div>


      <p class="muted">
        ${safe(movie.description)}
      </p>
    `;


  $("backBtn")
    .onclick =
      () =>
        openCategory(
          String(
            movie.category ||
            "movies"
          ).toLowerCase()
        );


  const player =
    $("moviePlayer");

  const errorBox =
    $("playerError");


  /* ----------------------------------------------
     VIDEO ERROR
  ---------------------------------------------- */

  player.onerror =
    function(){

      errorBox
        .classList
        .remove("hide");


      errorBox.innerHTML =
        `
          Video load/play error.<br><br>

          <small>
            ${safe(url)}
          </small>

          <br><br>

          Make sure the video is
          MP4 / H.264 / AAC.
        `;

    };


  /* ----------------------------------------------
     VIDEO LOADED
  ---------------------------------------------- */

  player.onloadedmetadata =
    function(){

      errorBox
        .classList
        .add("hide");

    };


  /* ----------------------------------------------
     CAN PLAY
  ---------------------------------------------- */

  player.oncanplay =
    function(){

      errorBox
        .classList
        .add("hide");

    };


  content.scrollIntoView({
    behavior:"smooth"
  });


  /*
    Important:
    Do not force autoplay.
    Browser can block autoplay.
  */

  player.load();

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function openAdmin(){

  const username =
    prompt(
      "Admin username"
    );


  if(username === null){

    return;

  }


  const password =
    prompt(
      "Admin password"
    );


  if(password === null){

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "/api/admin/login",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            username:
              username,

            password:
              password

          })

        }
      );


    const data =
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(
      !response.ok ||
      !data.token
    ){

      throw new Error(
        data.error ||
        "Invalid admin login."
      );

    }


    adminToken =
      data.token;


    renderAdmin();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   ADMIN PANEL
===================================================== */

function renderAdmin(){

  const admin =
    $("adminArea");


  admin
    .classList
    .remove("hide");


  admin.innerHTML =

    `
      <h2>
        👨‍💼 Admin Panel
      </h2>


      <div class="row">

        <input
          id="atitle"
          placeholder="Movie title">


        <select
          id="acategory">

          <option value="movies">
            MOVIES
          </option>

          <option value="private">
            PRIVATE
          </option>

        </select>


        <input
          id="aposterUrl"
          placeholder="Poster URL (optional)">


        <input
          id="avideoUrl"
          placeholder="Video URL (optional)">

      </div>


      <p class="file-note">
        Or upload files directly.
        MP4 / H.264 is recommended.
      </p>


      <label>
        Poster file
      </label>

      <input
        id="aposterFile"
        type="file"
        accept="image/*">


      <label>
        Video file
      </label>

      <input
        id="avideoFile"
        type="file"
        accept="video/mp4,video/webm,video/ogg">


      <textarea
        id="adesc"
        placeholder="Description">
      </textarea>


      <div class="actions">

        <button
          class="btn"
          id="addBtn"
          onclick="addMovie()">
          ADD MOVIE
        </button>


        <button
          class="small"
          onclick="closeAdmin()">
          CLOSE
        </button>

      </div>


      <div id="adminList">
      </div>
    `;


  renderAdminList();


  admin.scrollIntoView({
    behavior:"smooth"
  });

}


/* =====================================================
   ADD MOVIE
===================================================== */

async function addMovie(){

  if(!adminToken){

    alert(
      "Admin login required."
    );

    return;

  }


  const title =
    $("atitle")
      .value
      .trim();


  const category =
    $("acategory")
      .value;


  const posterUrl =
    $("aposterUrl")
      .value
      .trim();


  const videoUrl =
    $("avideoUrl")
      .value
      .trim();


  const posterFile =
    $("aposterFile")
      .files[0];


  const videoFile =
    $("avideoFile")
      .files[0];


  const description =
    $("adesc")
      .value
      .trim();


  if(!title){

    alert(
      "Movie title is required."
    );

    return;

  }


  if(
    !videoUrl &&
    !videoFile
  ){

    alert(
      "Video URL ya video file select karo."
    );

    return;

  }


  const form =
    new FormData();


  form.append(
    "title",
    title
  );


  form.append(
    "category",
    category
  );


  form.append(
    "posterUrl",
    posterUrl
  );


  form.append(
    "videoUrl",
    videoUrl
  );


  form.append(
    "description",
    description
  );


  if(posterFile){

    form.append(
      "poster",
      posterFile
    );

  }


  if(videoFile){

    form.append(
      "video",
      videoFile
    );

  }


  $("addBtn")
    .disabled = true;


  $("addBtn")
    .textContent =
      "UPLOADING...";


  try{

    const response =
      await fetch(
        API +
        "/api/movies",
        {

          method:"POST",

          headers:{
            Authorization:
              "Bearer " +
              adminToken
          },

          body:form

        }
      );


    const data =
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(!response.ok){

      throw new Error(
        data.error ||
        "Upload failed."
      );

    }


    alert(
      "Movie successfully added."
    );


    $("atitle").value =
      "";

    $("aposterUrl").value =
      "";

    $("avideoUrl").value =
      "";

    $("adesc").value =
      "";

    $("aposterFile").value =
      "";

    $("avideoFile").value =
      "";


    renderAdminList();


  }catch(error){

    alert(
      error.message
    );

  }finally{

    $("addBtn")
      .disabled = false;

    $("addBtn")
      .textContent =
        "ADD MOVIE";

  }

}


/* =====================================================
   ADMIN LIST
===================================================== */

async function renderAdminList(){

  const list =
    $("adminList");


  if(!list){

    return;

  }


  list.innerHTML =
    `
      <h3>
        Current Content
      </h3>
    `;


  try{

    await loadMovies();


    if(!movies.length){

      list.innerHTML +=
        `
          <p class="muted">
            No content yet.
          </p>
        `;

      return;

    }


    movies.forEach(
      movie => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "admin-row";


        row.innerHTML =

          `
            <span>

              <b>
                ${safe(movie.title)}
              </b>

              —
              ${safe(movie.category)}

            </span>


            <button
              class="small danger">
              DELETE
            </button>
          `;


        row
          .querySelector(
            "button"
          )
          .onclick =
            () =>
              deleteMovie(
                movie.id
              );


        list.appendChild(
          row
        );

      }
    );


  }catch(error){

    list.innerHTML +=
      `
        <p class="muted">
          ${safe(error.message)}
        </p>
      `;

  }

}


/* =====================================================
   DELETE MOVIE
===================================================== */

async function deleteMovie(
  id
){

  if(
    !confirm(
      "Delete this movie?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "/api/movies/" +
        encodeURIComponent(id),
        {

          method:"DELETE",

          headers:{
            Authorization:
              "Bearer " +
              adminToken
          }

        }
      );


    const data =
      await response
        .json()
        .catch(
          ()=>({})
        );


    if(!response.ok){

      throw new Error(
        data.error ||
        "Delete failed."
      );

    }


    renderAdminList();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =====================================================
   CLOSE ADMIN
===================================================== */

function closeAdmin(){

  $("adminArea")
    .classList
    .add("hide");

}


/* =====================================================
   ADMIN SHORTCUT
   CTRL + SHIFT + A
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.ctrlKey &&
      event.shiftKey &&
      event.key.toLowerCase()
      === "a"
    ){

      event.preventDefault();


      if(
        !$("home")
          .classList
          .contains("hide")
      ){

        openAdmin();

      }

    }

  }
);


/* =====================================================
   AUTO LOGIN FROM URL
===================================================== */

(async function(){

  const params =
    new URLSearchParams(
      location.search
    );


  const key =
    params.get("key");


  if(key){

    $("key").value =
      key.toUpperCase();


    await login();


    history.replaceState(
      {},
      document.title,
      USER_SITE
    );


    return;

  }


  /* -----------------------------------------------
     EXISTING SESSION
  ----------------------------------------------- */

  const savedKey =
    sessionStorage.getItem(
      "movie_access"
    );


  if(savedKey){

    showHome();

  }

})();

</script>
