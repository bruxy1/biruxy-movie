<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRUXY MOVIES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#fff}
header{position:sticky;top:0;z-index:10;background:#0d0d0df2;border-bottom:1px solid #222;padding:16px 6%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:800;letter-spacing:1px}.logo span{font-size:12px;display:block;color:#999;margin-top:2px}
nav button{background:none;border:0;color:#bbb;font-weight:700;margin-left:18px;cursor:pointer}nav button.active,nav button:hover{color:#fff}
.container{max-width:1200px;margin:auto;padding:28px 6%}.hero{padding:45px 0}.hero h1{font-size:clamp(34px,6vw,68px);margin:0 0 12px}.hero p{color:#aaa;max-width:650px;line-height:1.6}
.access{display:flex;gap:10px;max-width:520px;margin-top:24px}.access input{flex:1;padding:14px;border-radius:8px;border:1px solid #333;background:#151515;color:#fff}.access button,.watch{padding:14px 20px;border:0;border-radius:8px;background:#fff;color:#000;font-weight:800;cursor:pointer}
.notice{color:#888;font-size:13px;margin-top:10px}.section-title{margin:30px 0 18px;font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#444}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#191919}.card-body{padding:12px}.card h3{margin:0 0 5px;font-size:16px}.card p{margin:0;color:#888;font-size:12px}
.empty{padding:35px;border:1px dashed #333;border-radius:10px;color:#777;text-align:center}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-box{width:min(900px,100%);background:#111;border:1px solid #333;border-radius:12px;padding:20px}.close{float:right;background:none;border:0;color:#aaa;font-size:25px;cursor:pointer}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;margin:15px 0}.details h2{margin-bottom:8px}.details p{color:#aaa;line-height:1.6}
footer{padding:35px 6%;border-top:1px solid #222;color:#666;margin-top:60px;font-size:13px}
@media(max-width:600px){header{padding:14px 4%}.container{padding:20px 4%}.access{flex-direction:column}.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
</style>
</head>
<body>
<header>
  <div class="logo">BIRUXY<span>MOVIES</span></div>
  <nav>
    <button class="active" onclick="showSection('movies',this)">MOVIES</button>
    <button onclick="showSection('private',this)">PRIVATE</button>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <h1>Watch Movies Online</h1>
    <p>Enter the username generated by the ADUNLOCK website to access your movie collection.</p>
    <div class="access">
      <input id="username" placeholder="Enter your username">
      <button onclick="demoLogin()">LOGIN</button>
    </div>
    <div id="status" class="notice">Demo mode: username verification will be connected to the backend later.</div>
  </section>

  <section id="movies">
    <h2 class="section-title">MOVIES</h2>
    <div id="movieGrid" class="grid"></div>
  </section>

  <section id="private" class="hidden">
    <h2 class="section-title">PRIVATE</h2>
    <div id="privateGrid" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closePlayer()">×</button>
    <div id="playerContent"></div>
  </div>
</div>

<footer>BIRUXY MOVIES • Online streaming website prototype</footer>

<script>
const demoContent=[
 {type:"movies",title:"Demo Movie",poster:"https://via.placeholder.com/400x600/171717/ffffff?text=Movie",video:"",description:"Demo content. Admin-uploaded movies will appear here after the backend is connected."},
 {type:"private",title:"Private Demo",poster:"https://via.placeholder.com/400x600/171717/ffffff?text=Private",video:"",description:"Private content area."}
];

function getContent(){
 const saved=JSON.parse(localStorage.getItem("biruxyContent")||"[]");
 return [...demoContent,...saved];
}
function card(item){
 return `<article class="card" onclick='openMovie(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
 <img class="poster" src="${item.poster||"https://via.placeholder.com/400x600/171717/ffffff?text=No+Poster"}" onerror="this.src='https://via.placeholder.com/400x600/171717/ffffff?text=No+Poster'">
 <div class="card-body"><h3>${escapeHtml(item.title||"Untitled")}</h3><p>${escapeHtml(item.description||"")}</p></div></article>`;
}
function render(){
 const data=getContent();
 movieGrid.innerHTML=data.filter(x=>x.type==="movies").map(card).join("")||'<div class="empty">No movies available yet.</div>';
 privateGrid.innerHTML=data.filter(x=>x.type==="private").map(card).join("")||'<div class="empty">No private content available yet.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function demoLogin(){
 const v=username.value.trim();
 status.textContent=v?"Username received. Real 12-hour verification will be connected to the backend.":"Please enter a username.";
}
function showSection(id,btn){
 document.querySelectorAll("main section:not(.hero)").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}
function openMovie(item){
 let video=item.video?`<video class="video" controls playsinline src="${item.video}"></video>`:`<div class="video" style="display:flex;align-items:center;justify-content:center;color:#777">Video will appear here after an admin adds a video URL.</div>`;
 playerContent.innerHTML=`${video}<div class="details"><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.description||"")}</p></div>`;
 modal.classList.remove("hidden");
}
function closePlayer(){modal.classList.add("hidden");playerContent.innerHTML=""}
render();
</script>
</body>
</html>
