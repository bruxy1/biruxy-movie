<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIRUXY MOVIE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#090018,#16002d,#001b32);
 color:#fff;
 min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
 padding:18px 25px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#090909cc;
 backdrop-filter:blur(10px);
 position:sticky;
 top:0;
 z-index:10;
}
.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:2px;
}
header button{
 background:#ff176d;
 color:#fff;
 border:0;
 padding:10px 16px;
 border-radius:10px;
 font-weight:bold;
}

.center{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginbox{
 width:min(430px,100%);
 background:#11121b;
 padding:32px;
 border-radius:25px;
 box-shadow:0 20px 70px #0009;
 text-align:center;
 border:1px solid #333;
}

h1{
 margin-top:0;
}

.muted{
 color:#9ea3b5;
}

input,textarea{
 width:100%;
 padding:14px;
 margin:8px 0;
 border-radius:12px;
 border:1px solid #363949;
 background:#090b12;
 color:white;
 outline:none;
}

.primary{
 width:100%;
 border:0;
 padding:14px;
 border-radius:12px;
 background:linear-gradient(90deg,#ff176d,#7b2cff);
 color:white;
 font-weight:900;
 margin-top:10px;
}

.secondary{
 width:100%;
 padding:13px;
 border-radius:12px;
 border:1px solid #414555;
 background:#171923;
 color:#fff;
 margin-top:10px;
}

.error{
 color:#ff5f75;
 margin-top:12px;
}

.home{
 padding:30px;
 max-width:1200px;
 margin:auto;
}

.hero{
 text-align:center;
 padding:45px 10px;
}

.hero h1{
 font-size:clamp(38px,7vw,75px);
 background:linear-gradient(90deg,#ff176d,#8b3dff,#00d4ff);
 -webkit-background-clip:text;
 color:transparent;
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:25px;
}

.category{
 padding:35px;
 border-radius:25px;
 min-height:190px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
 transition:.2s;
}

.category:hover{
 transform:translateY(-5px) scale(1.02);
}

.movies{
 background:linear-gradient(135deg,#ff176d,#7b2cff);
}

.private{
 background:linear-gradient(135deg,#00a8ff,#00d4a8);
}

.list{
 padding:30px;
 max-width:1200px;
 margin:auto;
}

.moviegrid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
 gap:20px;
}

.movie{
 background:#11131c;
 border:1px solid #292d3a;
 border-radius:18px;
 overflow:hidden;
 cursor:pointer;
 transition:.2s;
}

.movie:hover{
 transform:translateY(-5px);
}

.poster{
 width:100%;
 height:280px;
 object-fit:cover;
 background:#20232d;
}

.movieinfo{
 padding:15px;
}

.movieinfo h3{
 margin:0 0 8px;
}

.admin{
 padding:30px;
 max-width:1100px;
 margin:auto;
}

.panel{
 background:#11131c;
 padding:25px;
 border:1px solid #292d3a;
 border-radius:20px;
 margin-bottom:20px;
}

.adminGrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
 gap:20px;
}

.item{
 padding:14px;
 border-bottom:1px solid #292d3a;
}

.delete{
 background:#ff174f;
 color:#fff;
 border:0;
 border-radius:8px;
 padding:7px 10px;
 float:right;
}

.player{
 max-width:1000px;
 margin:auto;
 padding:25px;
}

video{
 width:100%;
 max-height:70vh;
 background:#000;
 border-radius:18px;
}

.back{
 margin-bottom:15px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login" class="center">

<div class="loginbox">

<div class="logo">BIRUXY MOVIE</div>

<h1>LOGIN</h1>

<p class="muted">
Enter your ADUNLOCK username
</p>

<input
id="keyInput"
placeholder="USER-XXXXXX"
autocomplete="off">

<button
class="primary"
onclick="login()">
LOGIN
</button>

<button
class="secondary"
onclick="openUnlock()">
GET USERNAME
</button>

<div id="loginError" class="error"></div>

</div>

</section>


<!-- HOME -->

<section id="home" class="hidden">

<header>

<div class="logo">BIRUXY MOVIE</div>

<button onclick="logout()">LOGOUT</button>

</header>

<div class="home">

<div class="hero">

<h1>WELCOME</h1>

<p class="muted">
Choose what you want to watch
</p>

</div>

<div class="cards">

<div
class="category movies"
onclick="showCategory('MOVIES')">

<h2>🎬 MOVIES</h2>

<p>Watch movies online</p>

</div>

<div
class="category private"
onclick="showCategory('PRIVATE')">

<h2>🔒 PRIVATE</h2>

<p>Private collection</p>

</div>

</div>

</div>

</section>


<!-- LIST -->

<section id="list" class="hidden">

<header>

<div class="logo">BIRUXY MOVIE</div>

<button onclick="showHome()">HOME</button>

</header>

<div class="list">

<button
class="secondary back"
onclick="showHome()">
← BACK
</button>

<h1 id="listTitle"></h1>

<div
id="movieGrid"
class="moviegrid">
</div>

</div>

</section>


<!-- PLAYER -->

<section id="watch" class="hidden">

<header>

<div class="logo">BIRUXY MOVIE</div>

<button onclick="showHome()">HOME</button>

</header>

<div class="player">

<button
class="secondary back"
onclick="goBackList()">
← BACK
</button>

<h1 id="watchTitle"></h1>

<video
id="videoPlayer"
controls
playsinline>
</video>

<p
id="watchDescription"
class="muted">
</p>

</div>

</section>


<!-- ADMIN LOGIN -->

<section id="adminLogin" class="center hidden">

<div class="loginbox">

<div class="logo">ADMIN</div>

<h2>Admin Login</h2>

<input
id="adminUser"
placeholder="Username">

<input
id="adminPass"
type="password"
placeholder="Password">

<button
class="primary"
onclick="adminLogin()">
LOGIN
</button>

<button
class="secondary"
onclick="showLogin()">
BACK
</button>

<div
id="adminError"
class="error">
</div>

</div>

</section>


<!-- ADMIN -->

<section id="admin" class="hidden">

<header>

<div class="logo">ADMIN PANEL</div>

<button onclick="showHome()">HOME</button>

</header>

<div class="admin">

<div class="panel">

<h2>Add Content</h2>

<div class="adminGrid">

<div>

<label>Category</label>

<select
id="contentType"
style="
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
background:#090b12;
color:#fff;
border:1px solid #363949">

<option value="MOVIES">MOVIES</option>
<option value="PRIVATE">PRIVATE</option>

</select>

<input
id="contentTitle"
placeholder="Movie title">

<input
id="contentPoster"
placeholder="Poster URL">

<input
id="contentVideo"
placeholder="Video URL">

<textarea
id="contentDescription"
rows="5"
placeholder="Description">
</textarea>

<button
class="primary"
onclick="addContent()">
ADD CONTENT
</button>

</div>

<div>

<h3>Current Content</h3>

<div id="adminList"></div>

</div>

</div>

</div>

</div>

</section>


<script>

/* =========================================
   BACKEND
   ========================================= */

const ACCESS_API =
"https://biruxy-access-api.onrender.com";


/* =========================================
   ADUNLOCK WEBSITE
   ========================================= */

const UNLOCK_SITE =
"https://biruxy-movies.onrender.com";


/* =========================================
   CONTENT
   ========================================= */

let content =
JSON.parse(
localStorage.getItem("biruxy_content") || "[]"
);

let currentCategory="MOVIES";

let currentMovie=null;


/* =========================================
   SCREEN HELPER
   ========================================= */

function hideAll(){

[
"login",
"home",
"list",
"watch",
"adminLogin",
"admin"
].forEach(id=>{

document
.getElementById(id)
.classList.add("hidden");

});

}


/* =========================================
   LOGIN
   ========================================= */

async function login(){

const input =
document.getElementById("keyInput");

const key =
input.value.trim().toUpperCase();

const error =
document.getElementById("loginError");

error.textContent="";


if(!key){

error.textContent=
"Please enter your username.";

return;

}


try{

const response =
await fetch(
ACCESS_API+"/api/keys/verify",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
key:key
})
});


const data =
await response.json();


if(!response.ok || !data.valid){

error.textContent =
data.error ||
"Invalid or expired username.";

return;

}


sessionStorage.setItem(
"biruxy_key",
key
);


showHome();


}catch(e){

error.textContent =
"Server connection failed. Please try again.";

}

}


/* =========================================
   URL KEY AUTO LOGIN
   ========================================= */

async function checkUrlKey(){

const params =
new URLSearchParams(
window.location.search
);

const key =
params.get("key");


if(key){

document
.getElementById("keyInput")
.value=key;

await login();

}

}


/* =========================================
   HOME
   ========================================= */

function showHome(){

hideAll();

document
.getElementById("home")
.classList.remove("hidden");

}


/* =========================================
   CATEGORY
   ========================================= */

function showCategory(category){

currentCategory=category;

hideAll();

document
.getElementById("list")
.classList.remove("hidden");

document
.getElementById("listTitle")
.textContent =
category;


renderMovies();

}


/* =========================================
   MOVIE LIST
   ========================================= */

function renderMovies(){

const grid =
document.getElementById("movieGrid");

const filtered =
content.filter(
x=>x.type===currentCategory
);


if(!filtered.length){

grid.innerHTML =
`
<div style="
grid-column:1/-1;
text-align:center;
padding:50px">

<h2>No content yet</h2>

<p class="muted">
Admin has not added anything here.
</p>

</div>
`;

return;

}


grid.innerHTML =
filtered.map(
(movie,index)=>`

<div
class="movie"
onclick="watchMovie(${index})">

<img
class="poster"
src="${escapeAttr(movie.poster)}"
onerror="this.style.display='none'">

<div class="movieinfo">

<h3>
${escapeHtml(movie.title)}
</h3>

<p class="muted">
${escapeHtml(movie.description || "")}
</p>

</div>

</div>

`
).join("");

}


/* =========================================
   WATCH
   ========================================= */

function watchMovie(index){

const movies =
content.filter(
x=>x.type===currentCategory
);

currentMovie =
movies[index];

if(!currentMovie)return;

hideAll();

document
.getElementById("watch")
.classList.remove("hidden");

document
.getElementById("watchTitle")
.textContent =
currentMovie.title;

document
.getElementById("watchDescription")
.textContent =
currentMovie.description || "";

const player =
document.getElementById("videoPlayer");

player.src =
currentMovie.video || "";

}


/* =========================================
   BACK TO LIST
   ========================================= */

function goBackList(){

showCategory(currentCategory);

}


/* =========================================
   ADMIN LOGIN
   ========================================= */

function adminLogin(){

const user =
document
.getElementById("adminUser")
.value;

const pass =
document
.getElementById("adminPass")
.value;


if(
user==="shadab" &&
pass==="biruxy*@786"
){

hideAll();

document
.getElementById("admin")
.classList.remove("hidden");

renderAdmin();

}else{

document
.getElementById("adminError")
.textContent =
"Invalid admin login.";

}

}


/* =========================================
   ADD CONTENT
   ========================================= */

function addContent(){

const type =
document
.getElementById("contentType")
.value;

const title =
document
.getElementById("contentTitle")
.value.trim();

const poster =
document
.getElementById("contentPoster")
.value.trim();

const video =
document
.getElementById("contentVideo")
.value.trim();

const description =
document
.getElementById("contentDescription")
.value.trim();


if(!title){

alert("Please enter title.");

return;

}


content.push({
type,
title,
poster,
video,
description
});


saveContent();

renderAdmin();


[
"contentTitle",
"contentPoster",
"contentVideo",
"contentDescription"
].forEach(
id=>{
document.getElementById(id).value="";
});


}


/* =========================================
   SAVE
   ========================================= */

function saveContent(){

localStorage.setItem(
"biruxy_content",
JSON.stringify(content)
);

}


/* =========================================
   ADMIN LIST
   ========================================= */

function renderAdmin(){

const box =
document.getElementById("adminList");


if(!content.length){

box.innerHTML =
'<p class="muted">No content.</p>';

return;

}


box.innerHTML =
content.map(
(x,i)=>`

<div class="item">

<b>${escapeHtml(x.title)}</b>

<br>

<small class="muted">
${x.type}
</small>

<button
class="delete"
onclick="deleteContent(${i})">
DELETE
</button>

</div>

`
).join("");

}


/* =========================================
   DELETE
   ========================================= */

function deleteContent(index){

if(
!confirm("Delete this content?")
)return;

content.splice(index,1);

saveContent();

renderAdmin();

}


/* =========================================
   GET USERNAME
   ========================================= */

function openUnlock(){

window.location.href =
UNLOCK_SITE;

}


/* =========================================
   LOGOUT
   ========================================= */

function logout(){

sessionStorage.removeItem(
"biruxy_key"
);

showLogin();

}


/* =========================================
   LOGIN SCREEN
   ========================================= */

function showLogin(){

hideAll();

document
.getElementById("login")
.classList.remove("hidden");

}


/* =========================================
   ADMIN SHORTCUT
   CTRL + SHIFT + A
   ========================================= */

document.addEventListener(
"keydown",
function(e){

if(
e.ctrlKey &&
e.shiftKey &&
e.key.toLowerCase()==="a"
){

hideAll();

document
.getElementById("adminLogin")
.classList.remove("hidden");

}

});


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value){

return String(value || "")
.replace(
/[&<>"']/g,
function(char){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];

});

}


function escapeAttr(value){

return escapeHtml(value);

}


/* =========================================
   START
   ========================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

checkUrlKey();

});

</script>

</body>
</html>
