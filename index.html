<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRUXY MOVIES</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,7,7,.96);
    border-bottom:1px solid #222;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    display:block;
    color:#777;
    font-size:9px;
    letter-spacing:4px;
    margin-top:3px;
}

.nav button{
    background:none;
    border:0;
    color:#777;
    font-weight:bold;
    margin-left:18px;
    padding:8px;
}

.nav button.active,
.nav button:hover{
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 22px;
}

.hero{
    padding:75px 0 45px;
    border-bottom:1px solid #202020;
}

.hero small{
    color:#777;
    letter-spacing:3px;
    font-weight:bold;
}

.hero h1{
    font-size:clamp(42px,7vw,76px);
    line-height:.95;
    margin:15px 0;
}

.hero p{
    max-width:650px;
    color:#999;
    line-height:1.7;
}

.login{
    display:flex;
    gap:10px;
    max-width:570px;
    margin-top:28px;
}

.login input{
    flex:1;
    background:#111;
    border:1px solid #333;
    color:white;
    padding:14px;
    border-radius:8px;
    outline:none;
}

.primary{
    background:#fff;
    color:#000;
    border:0;
    border-radius:8px;
    padding:14px 22px;
    font-weight:900;
}

.secondary{
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:7px;
    padding:10px 14px;
    font-weight:bold;
}

.status{
    color:#777;
    font-size:13px;
    margin-top:10px;
}

.section{
    padding:38px 0;
}

.section h2{
    font-size:26px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.card{
    background:#101010;
    border:1px solid #222;
    border-radius:10px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#444;
}

.poster{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    background:#171717;
}

.card-body{
    padding:13px;
}

.card-body h3{
    font-size:16px;
    margin-bottom:7px;
}

.card-body p{
    color:#777;
    font-size:12px;
    line-height:1.5;
    min-height:35px;
}

.watch{
    width:100%;
    margin-top:12px;
}

.empty{
    border:1px dashed #333;
    padding:45px;
    text-align:center;
    color:#666;
    border-radius:10px;
}

footer{
    border-top:1px solid #222;
    padding:30px;
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:40px;
}

.hidden{
    display:none!important;
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.88);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    padding:22px;
}

.close{
    float:right;
    background:none;
    border:0;
    color:#999;
    font-size:28px;
}

.video{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    margin-top:15px;
}

.movie-details{
    margin-top:18px;
}

.movie-details p{
    color:#999;
    line-height:1.6;
    margin-top:8px;
}

/* ADMIN */

.admin-btn{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:200;
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    font-weight:bold;
}

.form{
    display:grid;
    gap:13px;
    margin-top:20px;
}

.form input,
.form textarea,
.form select{
    width:100%;
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:7px;
    padding:13px;
    outline:none;
}

.form textarea{
    min-height:110px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.admin-list{
    margin-top:25px;
    display:grid;
    gap:10px;
}

.admin-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#151515;
    border:1px solid #292929;
    border-radius:8px;
    padding:10px;
}

.admin-item img{
    width:48px;
    height:65px;
    object-fit:cover;
    border-radius:4px;
}

.admin-info{
    flex:1;
}

.admin-info strong{
    display:block;
    margin-bottom:5px;
}

.admin-info small{
    color:#777;
}

.delete{
    background:#211010;
    border:1px solid #422;
    color:#f77;
    padding:8px 10px;
    border-radius:6px;
}

.admin-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* MOBILE */

@media(max-width:650px){

    .nav{
        padding:14px;
    }

    .container{
        padding:0 14px;
    }

    .login{
        flex-direction:column;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .admin-item{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">

    <div class="logo">
        BIRUXY
        <span>MOVIES</span>
    </div>

    <div>
        <button class="active" onclick="openTab('movies',this)">
            MOVIES
        </button>

        <button onclick="openTab('private',this)">
            PRIVATE
        </button>
    </div>

</div>
</header>


<main class="container">

<section class="hero">

    <small>ONLINE STREAMING</small>

    <h1>
        Watch.<br>
        Enjoy.
    </h1>

    <p>
        Enter the username generated by ADUNLOCK
        to access the movie collection.
    </p>

    <div class="login">

        <input
            id="username"
            placeholder="Enter your username"
            autocomplete="off"
        >

        <button
            class="primary"
            onclick="loginUser()"
        >
            LOGIN
        </button>

    </div>

    <div id="status" class="status">
        Enter your ADUNLOCK username to continue.
    </div>

</section>


<section id="movies" class="section">

    <h2>MOVIES</h2>

    <div id="movieGrid" class="grid"></div>

</section>


<section id="private" class="section hidden">

    <h2>PRIVATE</h2>

    <div id="privateGrid" class="grid"></div>

</section>

</main>


<footer>
    BIRUXY MOVIES
</footer>


<!-- ADMIN BUTTON -->

<button
    class="admin-btn"
    onclick="openAdmin()"
>
    A
</button>


<!-- MOVIE PLAYER -->

<div
    id="playerOverlay"
    class="overlay hidden"
>

<div class="modal">

    <button
        class="close"
        onclick="closePlayer()"
    >
        ×
    </button>

    <div id="playerContent"></div>

</div>

</div>


<!-- ADMIN PANEL -->

<div
    id="adminOverlay"
    class="overlay hidden"
>

<div class="modal">

<button
    class="close"
    onclick="closeAdmin()"
>
×
</button>


<!-- ADMIN LOGIN -->

<div id="adminLogin">

    <h2>Admin Login</h2>

    <form
        class="form"
        onsubmit="adminLogin(event)"
    >

        <input
            id="adminUsername"
            placeholder="Admin username"
            required
        >

        <input
            id="adminPassword"
            type="password"
            placeholder="Admin password"
            required
        >

        <button class="primary">
            LOGIN
        </button>

    </form>

    <p
        id="adminError"
        class="status"
    ></p>

</div>


<!-- ADMIN DASHBOARD -->

<div
    id="adminDashboard"
    class="hidden"
>

<div class="admin-head">

    <h2>Admin Dashboard</h2>

    <button
        class="secondary"
        onclick="adminLogout()"
    >
        LOGOUT
    </button>

</div>


<form
    class="form"
    onsubmit="addContent(event)"
>

<div class="row">

    <input
        id="contentTitle"
        placeholder="Movie title"
        required
    >

    <select id="contentType">

        <option value="movies">
            MOVIES
        </option>

        <option value="private">
            PRIVATE
        </option>

    </select>

</div>


<input
    id="contentPoster"
    placeholder="Poster image URL"
    required
>


<input
    id="contentVideo"
    placeholder="Video URL"
    required
>


<textarea
    id="contentDescription"
    placeholder="Movie description"
></textarea>


<button class="primary">
    ADD CONTENT
</button>

</form>


<h3 style="margin-top:30px">
    Uploaded Content
</h3>

<div
    id="adminList"
    class="admin-list"
></div>

</div>

</div>

</div>


<script>

/* ===================================
   ADMIN LOGIN
=================================== */

const ADMIN_USERNAME = "shadab";
const ADMIN_PASSWORD = "biruxy*@786";


/* ===================================
   USER ACCESS
=================================== */

let userLoggedIn = false;


/*
   NOTE:
   Production mein yahan backend API
   ADUNLOCK username ko verify karega.
*/

function loginUser(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const status =
        document.getElementById("status");

    if(!username){

        status.textContent =
            "Please enter your username.";

        return;
    }

    /*
       Frontend access gate.

       Real 12-hour verification:
       Backend/database se connect karna hoga.
    */

    userLoggedIn = true;

    status.textContent =
        "Username accepted. You can now watch.";

    status.style.color =
        "#aaa";
}


/* ===================================
   CONTENT STORAGE
=================================== */

function getContent(){

    return JSON.parse(
        localStorage.getItem(
            "biruxy_content"
        ) || "[]"
    );

}


function saveContent(content){

    localStorage.setItem(
        "biruxy_content",
        JSON.stringify(content)
    );

}


/* ===================================
   HTML SAFETY
=================================== */

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ===================================
   RENDER WEBSITE
=================================== */

function renderWebsite(){

    const content =
        getContent();


    const movies =
        content.filter(
            item =>
            item.type === "movies"
        );


    const privateItems =
        content.filter(
            item =>
            item.type === "private"
        );


    const movieGrid =
        document.getElementById(
            "movieGrid"
        );


    const privateGrid =
        document.getElementById(
            "privateGrid"
        );


    movieGrid.innerHTML =
        movies.length
        ?
        movies.map(createCard).join("")
        :
        `<div class="empty">
            No movies available.
         </div>`;


    privateGrid.innerHTML =
        privateItems.length
        ?
        privateItems.map(createCard).join("")
        :
        `<div class="empty">
            No private content available.
         </div>`;

}


/* ===================================
   MOVIE CARD
=================================== */

function createCard(item){

    return `

    <article class="card">

        <img
            class="poster"
            src="${escapeHTML(item.poster)}"
            onerror="
                this.src='https://via.placeholder.com/500x750/111/fff?text=BIRUXY'
            "
        >

        <div class="card-body">

            <h3>
                ${escapeHTML(item.title)}
            </h3>

            <p>
                ${escapeHTML(item.description)}
            </p>

            <button
                class="secondary watch"
                onclick="watchMovie(${item.id})"
            >
                WATCH NOW
            </button>

        </div>

    </article>

    `;

}


/* ===================================
   WATCH MOVIE
=================================== */

function watchMovie(id){

    if(!userLoggedIn){

        alert(
            "Please login with your ADUNLOCK username first."
        );

        return;
    }


    const content =
        getContent();


    const movie =
        content.find(
            item =>
            item.id === id
        );


    if(!movie){
        return;
    }


    document.getElementById(
        "playerContent"
    ).innerHTML = `

        <video
            class="video"
            controls
            playsinline
            src="${escapeHTML(movie.video)}"
        ></video>

        <div class="movie-details">

            <h2>
                ${escapeHTML(movie.title)}
            </h2>

            <p>
                ${escapeHTML(movie.description)}
            </p>

        </div>

    `;


    document.getElementById(
        "playerOverlay"
    ).classList.remove(
        "hidden"
    );

}


function closePlayer(){

    document.getElementById(
        "playerOverlay"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "playerContent"
    ).innerHTML = "";

}


/* ===================================
   TABS
=================================== */

function openTab(tab,button){

    document
    .querySelectorAll(
        ".nav button"
    )
    .forEach(
        btn =>
        btn.classList.remove(
            "active"
        )
    );


    button.classList.add(
        "active"
    );


    document
    .getElementById("movies")
    .classList.toggle(
        "hidden",
        tab !== "movies"
    );


    document
    .getElementById("private")
    .classList.toggle(
        "hidden",
        tab !== "private"
    );

}


/* ===================================
   ADMIN OPEN
=================================== */

function openAdmin(){

    document
    .getElementById(
        "adminOverlay"
    )
    .classList.remove(
        "hidden"
    );


    if(
        sessionStorage.getItem(
            "biruxy_admin"
        ) === "true"
    ){

        showDashboard();

    }else{

        showAdminLogin();

    }

}


function closeAdmin(){

    document
    .getElementById(
        "adminOverlay"
    )
    .classList.add(
        "hidden"
    );

}


/* ===================================
   ADMIN LOGIN
=================================== */

function adminLogin(event){

    event.preventDefault();


    const username =
        document
        .getElementById(
            "adminUsername"
        )
        .value;


    const password =
        document
        .getElementById(
            "adminPassword"
        )
        .value;


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        sessionStorage.setItem(
            "biruxy_admin",
            "true"
        );

        showDashboard();

    }else{

        document
        .getElementById(
            "adminError"
        )
        .textContent =
            "Invalid admin username or password.";

    }

}


function showDashboard(){

    document
    .getElementById(
        "adminLogin"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "adminDashboard"
    )
    .classList.remove(
        "hidden"
    );


    renderAdmin();

}


function showAdminLogin(){

    document
    .getElementById(
        "adminLogin"
    )
    .classList.remove(
        "hidden"
    );


    document
    .getElementById(
        "adminDashboard"
    )
    .classList.add(
        "hidden"
    );

}


/* ===================================
   ADMIN LOGOUT
=================================== */

function adminLogout(){

    sessionStorage.removeItem(
        "biruxy_admin"
    );

    showAdminLogin();

}


/* ===================================
   ADD CONTENT
=================================== */

function addContent(event){

    event.preventDefault();


    const content =
        getContent();


    content.unshift({

        id:Date.now(),

        title:
            document
            .getElementById(
                "contentTitle"
            )
            .value
            .trim(),

        type:
            document
            .getElementById(
                "contentType"
            )
            .value,

        poster:
            document
            .getElementById(
                "contentPoster"
            )
            .value
            .trim(),

        video:
            document
            .getElementById(
                "contentVideo"
            )
            .value
            .trim(),

        description:
            document
            .getElementById(
                "contentDescription"
            )
            .value
            .trim()

    });


    saveContent(content);


    event.target.reset();


    renderWebsite();


    renderAdmin();


    alert(
        "Content added successfully."
    );

}


/* ===================================
   ADMIN CONTENT LIST
=================================== */

function renderAdmin(){

    const list =
        document.getElementById(
            "adminList"
        );


    const content =
        getContent();


    if(!content.length){

        list.innerHTML =
            `<div class="empty">
                No content added yet.
             </div>`;

        return;

    }


    list.innerHTML =
        content.map(item => `

        <div class="admin-item">

            <img
                src="${escapeHTML(item.poster)}"
                onerror="
                    this.src='https://via.placeholder.com/100x140/111/fff?text=BIRUXY'
                "
            >

            <div class="admin-info">

                <strong>
                    ${escapeHTML(item.title)}
                </strong>

                <small>
                    ${item.type.toUpperCase()}
                </small>

            </div>

            <button
                class="delete"
                onclick="deleteContent(${item.id})"
            >
                DELETE
            </button>

        </div>

        `).join("");

}


/* ===================================
   DELETE CONTENT
=================================== */

function deleteContent(id){

    const content =
        getContent()
        .filter(
            item =>
            item.id !== id
        );


    saveContent(content);


    renderWebsite();


    renderAdmin();

}


/* ===================================
   START
=================================== */

renderWebsite();

</script>

</body>
</html>
