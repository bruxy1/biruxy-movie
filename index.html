<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIRUXY MOVIES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#080014,#17002f,#050008);min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}
header{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#09000fcc;border-bottom:1px solid #ffffff20;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;letter-spacing:2px}.logo b{color:#ff3191}
.btn{border:0;border-radius:12px;padding:11px 17px;color:#fff;font-weight:800;background:linear-gradient(135deg,#713cff,#ff2586)}
#login{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:25px}
.box{width:min(430px,100%);padding:36px 30px;border-radius:28px;text-align:center;background:#ffffff0d;border:1px solid #ffffff20;box-shadow:0 25px 80px #0008;backdrop-filter:blur(16px)}
.icon{font-size:55px}.box h1{margin:8px 0;font-size:32px}.muted{color:#c8bfd5}
input,textarea,select{width:100%;padding:14px;margin:8px 0 12px;border:1px solid #ffffff20;border-radius:12px;background:#09000f;color:#fff;outline:0}
textarea{min-height:100px;resize:vertical}.box .btn{width:100%}.link{display:inline-block;margin-top:16px;color:#ff68ad;font-weight:800;text-decoration:none}.msg{min-height:20px;margin-top:10px}
main{padding:45px 24px}.hero{text-align:center;max-width:900px;margin:auto}.hero h1{font-size:clamp(38px,7vw,68px);margin:15px 0}.grad{background:linear-gradient(90deg,#a66cff,#ff3b9c);-webkit-background-clip:text;color:transparent}.hero p{color:#c9bfd7}
.cards{max-width:900px;margin:35px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{border:1px solid #ffffff20;border-radius:26px;padding:35px;min-height:230px;color:#fff;text-align:left;box-shadow:0 20px 55px #0006}.movies{background:linear-gradient(135deg,#5b25ff,#a62dff)}.private{background:linear-gradient(135deg,#d51c70,#ff4b4b)}.card h2{font-size:30px}.card button{margin-top:25px}
.section{max-width:1100px;margin:auto}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}.item{background:#ffffff0b;border:1px solid #ffffff16;border-radius:18px;overflow:hidden}.poster{width:100%;height:280px;object-fit:cover;background:#180d24}.item-body{padding:16px}.item h3{margin:0 0 8px}.item p{color:#c9bfd5;font-size:14px;line-height:1.5}.watch{width:100%;margin-top:8px}
video{width:100%;max-height:70vh;background:#000;border-radius:16px}
.admin{max-width:1000px;margin:35px auto;padding:25px;border-radius:22px;background:#ffffff0b;border:1px solid #ffffff18}.admin h2{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.small{padding:9px 12px;border:0;border-radius:10px;color:#fff;background:#ffffff18}.danger{background:#d92855}
@media(max-width:700px){.cards,.row{grid-template-columns:1fr}header{padding:0 14px}.logo{font-size:19px}main{padding:30px 15px}}
</style>
</head>
<body>

<header>
  <div class="logo">BIRUXY <b>MOVIES</b></div>
  <button class="btn hide" id="logoutBtn" onclick="logout()">LOGOUT</button>
</header>

<section id="login">
  <div class="box">
    <div class="icon">🎬</div>
    <h1>Welcome</h1>
    <p class="muted">Enter the username generated by the ADUNLOCK website.</p>
    <input id="key" placeholder="Enter your username / key" autocomplete="off">
    <button class="btn" onclick="login()">LOGIN</button>
    <div id="loginMsg" class="msg"></div>
    <a class="link" href="https://biruxy-movies.onrender.com" target="_blank">Get your username from user website</a>
  </div>
</section>

<section id="home" class="hide">
<main>
  <div class="hero">
    <h1>Watch <span class="grad">Your Content</span></h1>
    <p>Select a category. The content opens only after you select it.</p>
  </div>
  <div class="cards">
    <div class="card movies">
      <h2>🎬 MOVIES</h2><p>Open the Movies section.</p>
      <button class="btn" onclick="openCategory('MOVIES')">OPEN MOVIES</button>
    </div>
    <div class="card private">
      <h2>🔐 PRIVATE</h2><p>Open the Private section.</p>
      <button class="btn" onclick="openCategory('PRIVATE')">OPEN PRIVATE</button>
    </div>
  </div>
  <div id="content" class="section hide"></div>
  <div id="adminArea" class="admin hide"></div>
</main>
</section>

<script>
const USER_SITE="https://biruxy-movies.onrender.com";
const ADMIN_USER="shadab";
const ADMIN_PASS="biruxy*@786";

function data(){return JSON.parse(localStorage.getItem("biruxy_content")||"[]")}
function save(d){localStorage.setItem("biruxy_content",JSON.stringify(d))}
function validKey(k){
  if(!k)return false;
  const keys=JSON.parse(localStorage.getItem("biruxy_keys")||"[]");
  const found=keys.find(x=>x.key===k && x.expires>Date.now());
  return !!found;
}
function login(){
  const k=document.getElementById("key").value.trim();
  const m=document.getElementById("loginMsg");
  /* Real production verification must be server-side. */
  if(validKey(k)){
    sessionStorage.setItem("movie_access",k);
    showHome();
  }else{
    m.textContent="Invalid or expired username.";
    m.style.color="#ff6b8a";
  }
}
function showHome(){
  document.getElementById("login").classList.add("hide");
  document.getElementById("home").classList.remove("hide");
  document.getElementById("logoutBtn").classList.remove("hide");
}
function logout(){sessionStorage.removeItem("movie_access");location.reload()}
function openCategory(type){
  const el=document.getElementById("content");
  const list=data().filter(x=>x.type===type);
  el.classList.remove("hide");
  el.innerHTML=`<div class="section-head"><h2>${type==="MOVIES"?"🎬 Movies":"🔐 Private"}</h2><button class="small" onclick="elClose()">HOME</button></div>`;
  if(!list.length){el.innerHTML+=`<p class="muted">No content has been added yet.</p>`;return}
  const grid=document.createElement("div");grid.className="grid";
  list.forEach(x=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML=`<img class="poster" src="${safe(x.poster)}" alt=""><div class="item-body"><h3>${safe(x.title)}</h3><p>${safe(x.description)}</p><button class="btn watch">▶ WATCH NOW</button></div>`;
    d.querySelector("button").onclick=()=>watch(x);
    grid.appendChild(d);
  });
  el.appendChild(grid);
  el.scrollIntoView({behavior:"smooth"});
}
function elClose(){document.getElementById("content").classList.add("hide");window.scrollTo({top:0,behavior:"smooth"})}
function watch(x){
  const el=document.getElementById("content");
  el.innerHTML=`<div class="section-head"><h2>${safe(x.title)}</h2><button class="small" onclick="openCategory('${x.type}')">BACK</button></div><video controls playsinline src="${safe(x.video)}"></video><p class="muted">${safe(x.description)}</p>`;
  el.scrollIntoView({behavior:"smooth"});
}
function safe(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function openAdmin(){
  const u=prompt("Admin username");
  if(u===null)return;
  const p=prompt("Admin password");
  if(u===ADMIN_USER && p===ADMIN_PASS){renderAdmin()}else alert("Invalid admin login");
}
function renderAdmin(){
  const a=document.getElementById("adminArea");a.classList.remove("hide");
  a.innerHTML=`<h2>👨‍💼 Admin Panel</h2>
  <div class="row">
   <input id="atitle" placeholder="Title">
   <select id="atype"><option value="MOVIES">MOVIES</option><option value="PRIVATE">PRIVATE</option></select>
   <input id="aposter" placeholder="Poster URL">
   <input id="avideo" placeholder="Video URL">
  </div>
  <textarea id="adesc" placeholder="Description"></textarea>
  <div class="actions"><button class="btn" onclick="addContent()">ADD CONTENT</button><button class="small" onclick="closeAdmin()">CLOSE</button></div>
  <div id="adminList"></div>`;
  renderAdminList();
  a.scrollIntoView({behavior:"smooth"});
}
function addContent(){
  const title=document.getElementById("atitle").value.trim(),type=document.getElementById("atype").value,poster=document.getElementById("aposter").value.trim(),video=document.getElementById("avideo").value.trim(),description=document.getElementById("adesc").value.trim();
  if(!title||!video){alert("Title and video are required.");return}
  const d=data();d.push({id:Date.now(),title,type,poster,video,description});save(d);
  document.getElementById("atitle").value="";document.getElementById("aposter").value="";document.getElementById("avideo").value="";document.getElementById("adesc").value="";
  renderAdminList();
}
function renderAdminList(){
  const l=document.getElementById("adminList");if(!l)return;
  l.innerHTML="<h3>Current Content</h3>";
  data().forEach(x=>{
    const row=document.createElement("div");row.style.cssText="padding:12px 0;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;gap:10px;align-items:center";
    row.innerHTML=`<span><b>${safe(x.title)}</b> — ${x.type}</span><button class="small danger">DELETE</button>`;
    row.querySelector("button").onclick=()=>{save(data().filter(y=>y.id!==x.id));renderAdminList()};
    l.appendChild(row);
  });
}
function closeAdmin(){document.getElementById("adminArea").classList.add("hide")}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a")openAdmin()});
if(sessionStorage.getItem("movie_access"))showHome();
</script>
</body>
</html>
