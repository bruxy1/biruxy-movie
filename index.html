<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIRUXY MOVIE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#42106d 0,#12052d 35%,#020817 100%);
}

header{
  padding:22px;
  text-align:center;
  background:rgba(0,0,0,.35);
  border-bottom:1px solid rgba(255,255,255,.1);
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(10px);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:4px;
  color:#00eaff;
  text-shadow:0 0 20px #00eaff88;
}

.container{
  width:min(1150px,94%);
  margin:auto;
  padding:30px 0;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:24px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
  background:#00eaff;
  color:#001018;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.secondary{
  background:#ffffff18;
  color:white;
}

.danger{
  background:#ff416c;
  color:white;
}

.input,
textarea,
select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ffffff18;
  border-radius:12px;
  background:#070b1c;
  color:white;
  font-size:15px;
}

textarea{
  resize:vertical;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  max-width:500px;
  margin:13vh auto;
  text-align:center;
}

#loginPage h1{
  color:#00eaff;
}

.message{
  min-height:25px;
  color:#ffcf5a;
}

/* HOME */

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:40px;
  margin:5px 0;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin:25px 0;
}

.tabs button.active{
  background:#ff25d6;
  color:white;
}

/* MOVIES */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:20px;
}

.movie{
  overflow:hidden;
  padding:0;
  transition:.2s;
}

.movie:hover{
  transform:translateY(-4px);
}

.movie img{
  width:100%;
  height:270px;
  object-fit:cover;
  display:block;
  background:#111;
}

.movie-info{
  padding:15px;
}

.movie-title{
  margin:0 0 8px;
  font-size:18px;
}

.movie-description{
  color:#bbb;
  font-size:14px;
  line-height:1.5;
  min-height:42px;
}

.watch{
  width:100%;
  margin-top:10px;
}

/* PLAYER */

#playerBox{
  margin-top:30px;
}

video{
  width:100%;
  max-height:70vh;
  background:#000;
  border-radius:16px;
  display:block;
}

/* ADMIN */

.admin-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.admin-item{
  margin-top:12px;
  padding:16px;
  background:#ffffff08;
  border:1px solid #ffffff12;
  border-radius:14px;
}

.admin-item strong{
  color:#00eaff;
}

.small{
  color:#aaa;
  font-size:13px;
}

@media(max-width:700px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:30px;
  }

  .movie img{
    height:230px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BIRUXY MOVIE</div>
</header>

<div class="container">

<!-- LOGIN -->

<section id="loginPage" class="card">

  <h1>🎬 Welcome</h1>

  <p>
    Enter the username generated from the ADUNLOCK website.
  </p>

  <input
    id="usernameInput"
    class="input"
    placeholder="USER-XXXXXXXX"
    autocomplete="off"
  >

  <button onclick="loginUser()">
    LOGIN
  </button>

  <p id="loginMessage" class="message"></p>

  <button
    class="secondary"
    onclick="window.location.href='https://biruxy-movies.onrender.com'"
  >
    GET USERNAME
  </button>

</section>


<!-- HOME -->

<section id="homePage" class="hidden">

  <div class="card hero">

    <h1>🎬 BIRUXY MOVIE</h1>

    <p>
      Welcome! Choose your section.
    </p>

    <div class="tabs">

      <button
        id="moviesButton"
        class="active"
        onclick="changeCategory('movies')"
      >
        🎬 MOVIES
      </button>

      <button
        id="privateButton"
        onclick="changeCategory('private')"
      >
        🔒 PRIVATE
      </button>

      <button
        class="secondary"
        onclick="openAdmin()"
      >
        ⚙ ADMIN
      </button>

    </div>

  </div>


  <div id="movieGrid" class="grid"></div>


  <!-- PLAYER -->

  <div id="playerBox" class="card hidden">

    <h2 id="playerTitle"></h2>

    <p id="playerDescription"></p>

    <video
      id="moviePlayer"
      controls
      playsinline
    ></video>

  </div>

</section>


<!-- ADMIN -->

<section id="adminPage" class="hidden">

  <div class="card">

    <div class="admin-top">

      <h1>🔐 Admin Panel</h1>

      <button
        class="secondary"
        onclick="backHome()"
      >
        ← HOME
      </button>

    </div>


    <!-- ADMIN LOGIN -->

    <div id="adminLoginBox">

      <p>Login to manage your movies.</p>

      <input
        id="adminUsername"
        class="input"
        placeholder="Admin username"
      >

      <input
        id="adminPassword"
        class="input"
        type="password"
        placeholder="Admin password"
      >

      <button onclick="adminLogin()">
        ADMIN LOGIN
      </button>

      <p id="adminLoginMessage" class="message"></p>

    </div>


    <!-- ADMIN DASHBOARD -->

    <div id="adminDashboard" class="hidden">

      <hr>

      <h2>➕ Add Movie</h2>

      <div class="form-grid">

        <div>

          <label>Movie Title</label>

          <input
            id="movieTitle"
            class="input"
            placeholder="Movie title"
          >

        </div>


        <div>

          <label>Category</label>

          <select
            id="movieCategory"
            class="input"
          >

            <option value="movies">
              MOVIES
            </option>

            <option value="private">
              PRIVATE
            </option>

          </select>

        </div>

      </div>


      <label>Description</label>

      <textarea
        id="movieDescription"
        class="input"
        rows="4"
        placeholder="Movie description"
      ></textarea>


      <div class="form-grid">

        <div>

          <label>Poster File</label>

          <input
            id="posterFile"
            class="input"
            type="file"
            accept="image/*"
          >

        </div>


        <div>

          <label>Video File</label>

          <input
            id="videoFile"
            class="input"
            type="file"
            accept="video/*"
          >

        </div>

      </div>


      <p class="small">
        Agar file upload nahi karna hai to direct URL bhi use kar sakte ho.
      </p>


      <input
        id="posterUrl"
        class="input"
        placeholder="Poster URL (optional)"
      >


      <input
        id="videoUrl"
        class="input"
        placeholder="Video URL (optional)"
      >


      <button onclick="uploadMovie()">
        🚀 UPLOAD MOVIE
      </button>


      <button
        class="secondary"
        onclick="adminLogout()"
      >
        LOGOUT
      </button>


      <p
        id="uploadMessage"
        class="message"
      ></p>


      <hr>

      <h2>📚 Uploaded Movies</h2>

      <div id="adminMovieList"></div>

    </div>

  </div>

</section>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const API =
  "https://biruxy-access-api.onrender.com";

const USER_SITE =
  "https://biruxy-movies.onrender.com";


/* =========================
   VARIABLES
========================= */

let movies = [];

let category = "movies";

let adminToken =
  localStorage.getItem("biruxy_admin_token") || "";


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}


function showPage(page){

  $("loginPage").classList.add("hidden");

  $("homePage").classList.add("hidden");

  $("adminPage").classList.add("hidden");

  $(page).classList.remove("hidden");

}


/* =========================
   USER LOGIN
========================= */

async function loginUser(){

  const username =
    $("usernameInput").value.trim().toUpperCase();

  if(!username){

    $("loginMessage").textContent =
      "Please enter your username.";

    return;
  }

  $("loginMessage").textContent =
    "Checking username...";

  try{

    const response =
      await fetch(
        API + "/api/keys/verify",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            key:username
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error || "Invalid username."
      );

    }


    showPage("homePage");

    await loadMovies();

  }catch(error){

    $("loginMessage").textContent =
      error.message;

  }

}


/* =========================
   LOAD MOVIES
========================= */

async function loadMovies(){

  $("movieGrid").innerHTML =
    "<div class='card'>Loading movies...</div>";

  try{

    const response =
      await fetch(
        API + "/api/movies"
      );

    if(!response.ok){

      throw new Error(
        "Could not load movies."
      );

    }


    movies =
      await response.json();


    renderMovies();

  }catch(error){

    $("movieGrid").innerHTML =
      `<div class="card">
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   CATEGORY
========================= */

function changeCategory(value){

  category = value;

  $("moviesButton")
    .classList.toggle(
      "active",
      value === "movies"
    );

  $("privateButton")
    .classList.toggle(
      "active",
      value === "private"
    );

  renderMovies();

}


/* =========================
   RENDER MOVIES
========================= */

function renderMovies(){

  const list =
    movies.filter(
      movie =>
        movie.category === category
    );


  if(!list.length){

    $("movieGrid").innerHTML =
      `<div class="card">
        No ${category === "private" ? "private " : ""}movies uploaded yet.
      </div>`;

    return;

  }


  $("movieGrid").innerHTML =
    list.map(movie => {

      const poster =
        movie.poster || "";


      return `
        <article class="movie card">

          ${
            poster
            ?
            `<img
              src="${escapeAttribute(poster)}"
              alt="${escapeAttribute(movie.title)}"
              onerror="this.style.display='none'"
            >`
            :
            `<div
              style="
                height:270px;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#111;
                font-size:50px;
              "
            >
              🎬
            </div>`
          }


          <div class="movie-info">

            <h3 class="movie-title">
              ${escapeHtml(movie.title)}
            </h3>


            <div class="movie-description">
              ${escapeHtml(
                movie.description || ""
              )}
            </div>


            <button
              class="watch"
              onclick="watchMovie('${movie.id}')"
            >
              ▶ WATCH
            </button>

          </div>

        </article>
      `;

    }).join("");

}


/* =========================
   WATCH
========================= */

function watchMovie(id){

  const movie =
    movies.find(
      item => item.id === id
    );

  if(!movie){

    return;

  }


  $("playerTitle").textContent =
    movie.title;


  $("playerDescription").textContent =
    movie.description || "";


  const player =
    $("moviePlayer");


  player.pause();

  player.src =
    movie.video || "";


  player.load();


  $("playerBox")
    .classList.remove("hidden");


  $("playerBox")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   ADMIN PAGE
========================= */

function openAdmin(){

  showPage("adminPage");


  if(adminToken){

    $("adminLoginBox")
      .classList.add("hidden");

    $("adminDashboard")
      .classList.remove("hidden");

    loadAdminMovies();

  }else{

    $("adminLoginBox")
      .classList.remove("hidden");

    $("adminDashboard")
      .classList.add("hidden");

  }

}


function backHome(){

  showPage("homePage");

  loadMovies();

}


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  const username =
    $("adminUsername").value;

  const password =
    $("adminPassword").value;


  $("adminLoginMessage").textContent =
    "Logging in...";


  try{

    const response =
      await fetch(
        API + "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Admin login failed."
      );

    }


    adminToken =
      data.token;


    localStorage.setItem(
      "biruxy_admin_token",
      adminToken
    );


    $("adminLoginBox")
      .classList.add("hidden");


    $("adminDashboard")
      .classList.remove("hidden");


    $("adminLoginMessage")
      .textContent = "";


    loadAdminMovies();


  }catch(error){

    $("adminLoginMessage").textContent =
      error.message;

  }

}


/* =========================
   UPLOAD MOVIE
========================= */

async function uploadMovie(){

  if(!adminToken){

    $("uploadMessage").textContent =
      "Please login as admin first.";

    return;

  }


  const title =
    $("movieTitle").value.trim();


  if(!title){

    $("uploadMessage").textContent =
      "Movie title is required.";

    return;

  }


  const posterFile =
    $("posterFile").files[0];


  const videoFile =
    $("videoFile").files[0];


  const posterUrl =
    $("posterUrl").value.trim();


  const videoUrl =
    $("videoUrl").value.trim();


  if(!posterFile && !posterUrl){

    $("uploadMessage").textContent =
      "Upload a poster or enter poster URL.";

    return;

  }


  if(!videoFile && !videoUrl){

    $("uploadMessage").textContent =
      "Upload a video or enter video URL.";

    return;

  }


  const form =
    new FormData();


  form.append(
    "title",
    title
  );


  form.append(
    "description",
    $("movieDescription").value.trim()
  );


  form.append(
    "category",
    $("movieCategory").value
  );


  form.append(
    "posterUrl",
    posterUrl
  );


  form.append(
    "videoUrl",
    videoUrl
  );


  if(posterFile){

    form.append(
      "poster",
      posterFile
    );

  }


  if(videoFile){

    form.append(
      "video",
      videoFile
    );

  }


  $("uploadMessage").textContent =
    "Uploading... Please wait.";


  try{

    const response =
      await fetch(
        API + "/api/movies",
        {
          method:"POST",

          headers:{
            Authorization:
              "Bearer " + adminToken
          },

          body:form
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Upload failed."
      );

    }


    $("uploadMessage").textContent =
      "✅ Movie uploaded successfully!";


    $("movieTitle").value = "";

    $("movieDescription").value = "";

    $("posterUrl").value = "";

    $("videoUrl").value = "";

    $("posterFile").value = "";

    $("videoFile").value = "";


    await loadAdminMovies();


  }catch(error){

    $("uploadMessage").textContent =
      "❌ " + error.message;

  }

}


/* =========================
   ADMIN MOVIE LIST
========================= */

async function loadAdminMovies(){

  try{

    const response =
      await fetch(
        API + "/api/movies"
      );


    movies =
      await response.json();


    renderMovies();


    if(!movies.length){

      $("adminMovieList").innerHTML =
        "<p>No movies uploaded.</p>";

      return;

    }


    $("adminMovieList").innerHTML =
      movies.map(movie => {

        return `
          <div class="admin-item">

            <strong>
              ${escapeHtml(movie.title)}
            </strong>

            <div class="small">
              Category:
              ${escapeHtml(movie.category)}
            </div>

            <br>

            <button
              class="danger"
              onclick="deleteMovie('${movie.id}')"
            >
              🗑 DELETE
            </button>

          </div>
        `;

      }).join("");


  }catch(error){

    $("adminMovieList").innerHTML =
      "<p>Could not load movie list.</p>";

  }

}


/* =========================
   DELETE
========================= */

async function deleteMovie(id){

  if(!confirm(
    "Are you sure you want to delete this movie?"
  )){

    return;

  }


  try{

    const response =
      await fetch(
        API + "/api/movies/" + id,
        {
          method:"DELETE",

          headers:{
            Authorization:
              "Bearer " + adminToken
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Delete failed."
      );

    }


    await loadAdminMovies();


  }catch(error){

    alert(error.message);

  }

}


/* =========================
   ADMIN LOGOUT
========================= */

function adminLogout(){

  adminToken = "";

  localStorage.removeItem(
    "biruxy_admin_token"
  );

  location.reload();

}


/* =========================
   SECURITY DISPLAY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================
   AUTO LOGIN FROM ?key=
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const keyFromUrl =
  params.get("key");


if(keyFromUrl){

  $("usernameInput").value =
    keyFromUrl;

  loginUser();

}

</script>

</body>
</html>
